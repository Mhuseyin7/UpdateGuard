services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - control-plane
    security_opt:
      - no-new-privileges:true
    read_only: true
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - agent
    environment:
      UPDATEGUARD_AGENT_URL: http://agent:8081
      UPDATEGUARD_AGENT_TOKEN: ${UPDATEGUARD_AGENT_TOKEN:?Copy .env.example to .env and set UPDATEGUARD_AGENT_TOKEN}
    security_opt:
      - no-new-privileges:true
    read_only: true
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    # The agent alone receives Docker access. This will be replaced by a rootless socket proxy
    # and mTLS before a production remote-agent release.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker socket access is root-equivalent host authority. Use root only in
    # this isolated agent; no other UpdateGuard service receives this mount.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    environment:
      UPDATEGUARD_AGENT_TOKEN: ${UPDATEGUARD_AGENT_TOKEN:?Copy .env.example to .env and set UPDATEGUARD_AGENT_TOKEN}
    expose:
      - "8081"
